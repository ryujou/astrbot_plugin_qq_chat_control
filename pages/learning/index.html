<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>群聊学习 · QQ 聊天控制</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" aria-label="群列表">
      <a class="brand" href="#overview"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 7h22v15H16l-7 5v-5H5z"/><path d="M11 13h10M11 17h6"/></svg><span>群聊学习<small>QQ 聊天控制</small></span></a>
      <div id="account" class="account">正在连接机器人…</div>
      <label class="search-label" for="groupSearch">选择群聊</label>
      <input id="groupSearch" type="search" placeholder="搜索群名或群号" aria-label="搜索群名或群号">
      <div id="groupList" class="group-list" aria-live="polite"></div>
      <p class="sidebar-note">每个群有自己的画像、词库与表情包。停用的群保留已积累的资料。</p>
    </aside>
    <main>
      <header class="page-header">
        <div><div class="eyebrow">群聊观察</div><h1 id="groupTitle">正在加载群聊</h1><p id="groupMeta" class="muted">读取已保存的学习资料</p></div>
        <div class="header-actions"><span id="updated" class="muted"></span><button id="refresh" type="button" class="button">刷新数据<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button></div>
      </header>
      <div id="connectionNotice" class="notice" hidden></div>
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="groupStatus" class="status-line"></div>
      <nav class="tabs" aria-label="学习资料">
        <button data-tab="overview" class="active" aria-current="page">群画像</button>
        <button data-tab="replies">回复评分</button>
        <button data-tab="stickers">表情包</button>
        <button data-tab="slang">梗与黑话</button>
        <button data-tab="members">成员画像</button>
      </nav>
      <section id="content" aria-live="polite" aria-busy="true"><div class="empty">正在读取数据…</div></section>
      <footer>互动分描述接话情况，不等于回答正确。对照样本不足时，不据此判断策略提升。</footer>
    </main>
  </div>
  <dialog id="detail" aria-labelledby="detailTitle"><div class="dialog-head"><div><div class="eyebrow">回复与判断依据</div><h2 id="detailTitle">回复详情</h2></div><button id="closeDetail" class="button" type="button">关闭</button></div><div id="detailContent"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
